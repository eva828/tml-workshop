[package]
name = "tml-workshop"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
csv = "1.4.0"
directories = "6"
flate2 = "1.1.9"
futures = "0.3.33"
hjson-edit = { version = "0.1.0", path = "../hjson-edit", default-features = false }
indicatif = "0.18.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
steam-vent-cdn = { version = "0.1.0", path = "../SteamVentCdn" }
tabled = "0.21.0"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
sha1 = "0.10"
